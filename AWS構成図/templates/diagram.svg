<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Inter','Helvetica Neue',Arial,'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1F2937" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowGray" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#545B64"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#01A88D"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="48" y="52" font-size="24" font-weight="700" fill="#232F3E">TITLE</text>
  <text x="48" y="74" font-size="12.5" fill="#8A8F98">SUBTITLE</text>

  <!-- AWS Account (公式グループスタイル: 枠 #CD2264 実線) -->
  <rect x="48" y="88" width="1184" height="592" rx="4" fill="none" stroke="#CD2264" stroke-width="1.5"/>
  {{GR:AWS-Account_32|72|102|22}}
  <text x="102" y="119" font-size="15" font-weight="700" fill="#CD2264">ACCOUNT_LABEL</text>

  <!-- VPC (公式グループスタイル: 枠 #8C4FFF 実線) -->
  <rect x="84" y="150" width="648" height="496" rx="4" fill="none" stroke="#8C4FFF" stroke-width="1.5"/>
  {{GR:Virtual-private-cloud-VPC_32|110|162|22}}
  <text x="140" y="179" font-size="14" font-weight="700" fill="#232F3E">VPC</text>

  <!-- Subnet (公式Public subnetスタイル: 塗り #F2F6E8、枠なし。Privateは #E6F6F7 / 文字 #147EBA) -->
  <rect x="108" y="200" width="600" height="200" rx="4" fill="#F2F6E8"/>
  {{GR:Public-subnet_32|134|212|20}}
  <text x="160" y="227" font-size="12.5" font-weight="600" fill="#248814">Subnet</text>

  <rect x="108" y="428" width="600" height="200" rx="4" fill="#F2F6E8"/>
  {{GR:Public-subnet_32|134|440|20}}
  <text x="160" y="455" font-size="12.5" font-weight="600" fill="#248814">Subnet</text>

  <!-- リソースカード例 -->
  <rect x="132" y="244" width="544" height="132" rx="10" fill="#FFFFFF" stroke="#E8EAED" stroke-width="1" filter="url(#cardShadow)"/>
  {{IC:Arch_Amazon-EC2_64|156|268|48}}
  <text x="228" y="290" font-size="17" font-weight="700" fill="#232F3E">RESOURCE_LABEL</text>
  <text x="228" y="310" font-size="12" fill="#6B7280">RESOURCE_SUB</text>
  <g font-size="12" fill="#374151">
    <rect x="228" y="326" width="100" height="24" rx="12" fill="#F3F4F6" stroke="#E5E7EB"/>
    <text x="278" y="342.5" text-anchor="middle">CHIP1</text>
  </g>
  <!-- Security Groupバッジ（公式アイコン廃止のため手描き。幅はテキスト長に応じて調整） -->
  <rect x="540" y="230" width="128" height="28" rx="14" fill="#FDECEC" stroke="#F3C2C2"/>
  <path d="M557 236.5 L563 238.8 V243 C563 246.6 557 249.5 557 249.5 C557 249.5 551 246.6 551 243 V238.8 Z" fill="#FFFFFF" stroke="#DD344C" stroke-width="1.5"/>
  <text x="568" y="248.5" font-size="11" font-weight="600" fill="#B91C1C">Security Group</text>

  <!-- 接続: IAM Role -> EC2 -->
  <path d="M796 236 H744 V300 H684" fill="none" stroke="#545B64" stroke-width="1.8" marker-end="url(#arrowGray)"/>
  <text x="754" y="227" font-size="11" fill="#545B64">ARROW1_LABEL</text>

  <!-- 接続: SSM -> EC2（管理プレーンは点線） -->
  <path d="M796 386 H724 V344 H684" fill="none" stroke="#545B64" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>
  <text x="734" y="377" font-size="11" fill="#545B64">ARROW2_LABEL</text>

  <!-- 接続: EC2 -> Bedrock（データプレーンはティール #01A88D） -->
  <path d="M404 376 V414 H756 V560 H789" fill="none" stroke="#01A88D" stroke-width="1.8" marker-end="url(#arrowTeal)"/>
  <text x="420" y="406" font-size="11" fill="#0F766E">ARROW3_LABEL</text>

  <!-- 右列カード例 -->
  <rect x="796" y="180" width="404" height="112" rx="10" fill="#FFFFFF" stroke="#E8EAED" stroke-width="1" filter="url(#cardShadow)"/>
  {{IC:Arch_AWS-Identity-and-Access-Management_64|820|208|48}}
  <text x="888" y="232" font-size="16" font-weight="700" fill="#232F3E">RIGHT1_LABEL</text>
  <text x="888" y="254" font-size="12" fill="#6B7280">RIGHT1_SUB</text>

  <rect x="796" y="330" width="404" height="112" rx="10" fill="#FFFFFF" stroke="#E8EAED" stroke-width="1" filter="url(#cardShadow)"/>
  {{IC:Arch_AWS-Systems-Manager_64|820|358|48}}
  <text x="888" y="382" font-size="15" font-weight="700" fill="#232F3E">RIGHT2_LABEL</text>
  <text x="888" y="404" font-size="12" fill="#6B7280">RIGHT2_SUB</text>

  <rect x="796" y="496" width="404" height="128" rx="10" fill="#FFFFFF" stroke="#E8EAED" stroke-width="1" filter="url(#cardShadow)"/>
  {{IC:Arch_Amazon-Bedrock_64|820|524|48}}
  <text x="888" y="548" font-size="16" font-weight="700" fill="#232F3E">RIGHT3_LABEL</text>
  <rect x="888" y="560" width="120" height="24" rx="12" fill="#DCF3EC" stroke="#01A88D"/>
  <text x="948" y="576.5" font-size="12" fill="#0F766E" text-anchor="middle">RIGHT3_CHIP</text>
</svg>
