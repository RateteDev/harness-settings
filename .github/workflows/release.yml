# v で始まるタグを push するか、版を指定して手で動かすと、hako の成果物を作って GitHub のリリースに置く。
# mise の github バックエンドは、リリースの成果物の名前から OS とアーキテクチャを選んで入れる。
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 版（例 0.1.0）
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: environments/hako/go.mod
          cache-dependency-path: environments/hako/go.mod
      - uses: jdx/mise-action@v2
      - run: just ci-local
      - name: 版を決める
        run: |
          v="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          echo "VERSION=${v#v}" >> "$GITHUB_ENV"
        env:
          INPUT_VERSION: ${{ inputs.version }}
      - run: just release-build "$VERSION"
      - name: リリースに置く
        run: gh release create "v$VERSION" dist/* --title "v$VERSION" --generate-notes --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
