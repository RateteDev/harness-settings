@layer tokens, structure, design;
@layer tokens {
  :root, [data-theme="snow"] {
    color-scheme: light;
    --color-bg: #f2f2ee; --color-surface: #fbfbf8; --color-hover: #e4e4df;
    --color-ink: #111111; --color-ink-muted: #555555; --color-line: #8c8c8c;
    --color-dot: rgb(17 17 17 / 8%);
  }
  [data-theme="obsidian"] {
    color-scheme: dark;
    --color-bg: #0d0d0d; --color-surface: #151515; --color-hover: #262626;
    --color-ink: #ededed; --color-ink-muted: #a6a6a6; --color-line: #6b6b6b;
    --color-dot: rgb(237 237 237 / 6%);
  }
  :root {
    --font-body: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic UI", sans-serif;
    --font-dot: DotGothic16, "BIZ UDGothic", monospace;
    --font-code: ui-monospace, "Cascadia Mono", Consolas, "BIZ UDGothic", monospace;
    --text-xs: 0.75rem; --text-sm: 0.875rem;
    --gutter: clamp(1rem, 4vw, 3rem);
    --pad-box: 0.625rem 0.875rem;
    --gap-grid: 1.5rem;
    --rule: 1px solid var(--color-line);
    --rule-dotted: 1px dotted var(--color-line);
    --rule-ink: 1px solid var(--color-ink);
  }
}
@layer structure {
  :root { font-family: var(--font-body); font-variant-numeric: lining-nums tabular-nums; -webkit-text-size-adjust: 100%; }
  * { box-sizing: border-box; }
  body { min-width: 18rem; min-height: 100vh; margin: 0; font-size: 1rem; line-height: 1.75; }
  h1, h2, h3 { margin: 0; font-weight: 400; line-height: 1.25; text-wrap: balance; }
  h1 { margin-block-end: 1rem; font-size: clamp(1.75rem, 5vw, 2.5rem); }
  h2 { font-size: 1.5rem; }
  h3 { font-size: 1rem; }
  a { color: inherit; text-underline-offset: 0.25em; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--color-ink); outline-offset: 2px; }
  .num, .digit { font-family: var(--font-dot); }
  .num, .site-footer, .created, .notes, .toc-desc, .loader-text, .finding-label, .meta, .card-body summary, .scripts li summary, pre { font-size: var(--text-sm); }
  .tag, .prompt-label { font-size: var(--text-xs); }

  .site-header { display: flex; align-items: center; gap: 0.5rem 2rem; padding: 0.75rem var(--gutter); border-block-end: var(--rule-ink); }
  .brand { flex: 1 1 auto; font-size: 1.125rem; }
  .theme-toggle { display: grid; place-items: center; width: 2.75rem; height: 2.75rem; margin-inline-end: -0.75rem; padding: 0; border: 0; background: none; cursor: pointer; }
  .theme-toggle svg { width: 20px; height: 20px; }
  /* The icon shows the theme a press switches to. */
  [data-theme="snow"] .icon-sun, [data-theme="obsidian"] .icon-moon { display: none; }
  .site-main { width: min(100%, 80rem); padding: clamp(1.5rem, 4vw, 3rem) var(--gutter) 4rem; }
  .site-footer { padding: 1rem var(--gutter); border-block-start: var(--rule-dotted); overflow-wrap: anywhere; }

  .lead { max-width: 44rem; margin: 0; }
  .created { margin: 0.75rem 0 0; }
  .notes, .finding { padding: var(--pad-box); border-inline-start: 3px solid var(--color-ink); }
  .notes { max-width: 44rem; margin: 1.5rem 0 0; border-inline-start-color: var(--color-line); }
  .notes p { margin: 0; }
  .finding { max-width: 48rem; margin: 1rem 0 1.5rem; }
  .finding-label { display: block; }

  .row-list { margin: 0; padding: 0; list-style: none; border-block-start: var(--rule-dotted); }
  .row-list > li { min-width: 0; border-block-end: var(--rule-dotted); }
  .toc { margin-block-start: 2.5rem; }
  .toc-link { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr) auto; gap: 0.25rem 1rem; align-items: baseline; padding: 0.625rem 0.5rem; text-decoration: none; }
  .toc-desc { grid-column: 2 / -1; }

  .stage { margin-block-start: 2.5rem; scroll-margin-top: 1rem; overflow-anchor: none; }
  .stage-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 1rem; padding: 0.25rem 0.5rem 0.5rem 0; border-block-end: var(--rule-ink); list-style: none; cursor: pointer; }
  .stage-head::-webkit-details-marker { display: none; }
  .stage-head h2 { flex: 1 1 auto; }
  .stage:not([open]) > .stage-head { border-block-end: var(--rule-dotted); }
  .stage-body { display: flow-root; }
  .fold { display: inline-grid; place-items: center; width: 1.125rem; height: 1.125rem; align-self: center; border: var(--rule); font-size: var(--text-sm); line-height: 1; }
  .fold::before { content: "+"; }
  .stage[open] > .stage-head .fold::before { content: "−"; }

  .loader { display: none; place-items: center; align-content: center; gap: 1rem; min-height: 60vh; }
  .is-loading .loader { display: grid; }
  .is-loading .site-main, .is-loading .site-footer { display: none; }
  .loader-text { margin: 0; }
  .spinner { display: grid; grid-template-columns: repeat(3, 0.5rem); gap: 0.25rem; }
  .spinner i { width: 0.5rem; height: 0.5rem; animation: pixel 0.8s steps(4, end) infinite; }
  /* Clockwise from the top-left cell; the centre stays empty. */
  .spinner i:nth-child(5) { visibility: hidden; animation: none; }
  .spinner i:nth-child(1) { animation-delay: -0.8s; } .spinner i:nth-child(2) { animation-delay: -0.7s; }
  .spinner i:nth-child(3) { animation-delay: -0.6s; } .spinner i:nth-child(6) { animation-delay: -0.5s; }
  .spinner i:nth-child(9) { animation-delay: -0.4s; } .spinner i:nth-child(8) { animation-delay: -0.3s; }
  .spinner i:nth-child(7) { animation-delay: -0.2s; } .spinner i:nth-child(4) { animation-delay: -0.1s; }
  @media (prefers-reduced-motion: reduce) { .spinner i { animation-duration: 2.4s; } }

  .grid, .refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); gap: var(--gap-grid); }
  .refs { grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr)); }
  .card { min-width: 0; display: flex; flex-direction: column; border: var(--rule); scroll-margin-top: 1rem; }
  .card:target { outline: 2px solid var(--color-ink); outline-offset: 4px; }
  .thumb { border-block-end: var(--rule); }
  .thumb img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; }
  .card-body { display: grid; gap: 0.25rem; padding: var(--pad-box); }
  .card-title { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem 1rem; flex-wrap: wrap; overflow-wrap: anywhere; }
  .tag { padding-inline: 0.375rem; line-height: 1.5; white-space: nowrap; outline: var(--rule); outline-offset: -1px; }
  .tag-composite { outline-style: dotted; }
  .meta { margin: 0; overflow-wrap: anywhere; }

  .card-body details, .scripts li details { border-block-start: var(--rule-dotted); }
  .card-body summary, .scripts li summary { padding-block: 0.375rem; cursor: pointer; }
  .scripts li details { padding-inline: 0.5rem; }
  .prompt-label { margin: 0.5rem 0 0.25rem; }
  .code { position: relative; margin: 0 0 0.75rem; }
  .code pre { margin: 0; padding: 0.625rem 2.75rem 0.625rem 0.875rem; border: var(--rule); font-family: inherit; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
  .scripts pre { max-height: 28rem; overflow: auto; font-family: var(--font-code); }
  .copy { position: absolute; top: 0.25rem; right: 0.25rem; display: grid; place-items: center; width: 2rem; height: 2rem; padding: 0; border: 1px solid transparent; background: none; cursor: pointer; }
  .copy svg { width: 16px; height: 16px; }
  .copy-done { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
}
@layer design {
  body { background-color: var(--color-bg); background-image: radial-gradient(var(--color-dot) 1px, transparent 1.5px); background-size: 8px 8px; color: var(--color-ink); }
  .site-header, .thumb, .code pre { background: var(--color-bg); }
  .card, .notes, .finding { background: var(--color-surface); }
  .muted, .site-footer, .tag, .copy, .theme-toggle { color: var(--color-ink-muted); }
  .copy:hover, .theme-toggle:hover { color: var(--color-ink); }
  .copy:hover { border-color: var(--color-line); background: var(--color-surface); }
  .toc-link:hover, .stage-head:hover, .card-body summary:hover, .scripts li summary:hover { background: var(--color-hover); }
  :where(a):hover { text-decoration-style: dotted; }
  .spinner i { background: var(--color-ink); }
  @keyframes pixel { 0% { opacity: 1; } 100% { opacity: 0.12; } }
}

@layer structure {
  .tag-adopted { outline-style: solid; }
  .card-adopted { border-color: var(--color-ink); }
  .card-text .card-body { gap: 0.5rem; }
  .body { margin: 0; }
  .code-label { margin: 0.25rem 0 -0.25rem; }
  .grid-square { grid-template-columns: repeat(auto-fill, minmax(min(100%, 14rem), 1fr)); }
  .grid-square .thumb img { aspect-ratio: 1; }
}
@layer design {
  .tag-adopted { color: var(--color-ink); outline-color: var(--color-ink); }
}
@layer structure {
  .thumb-button { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
  .thumb-button img { display: block; width: 100%; }
  .grid-diagram .thumb img { aspect-ratio: 8 / 5; }

<script>
(() => {
  const UNIT = '案', GRID_CLASS = 'grid grid-diagram';
  function renderCard(e) {
    return el('article', { class: `card${e.adopted ? ' card-adopted' : ''}`, id: e.id },
      el('button', { type: 'button', class: 'thumb-button', 'data-asset': e.assetId, 'data-title': e.title, 'aria-label': `${e.title} を拡大表示` },
        el('img', { src: url(assets[e.assetId]), alt: e.title, loading: 'lazy', decoding: 'async' })),
      el('div', { class: 'card-body' },
        el('div', { class: 'card-title' }, el('span', {}, ...digits(e.title)), adoptedTag(e)),
        basedOn(e, 'もとにした案'),
        e.body ? el('p', { class: 'body' }, e.body) : null,
        e.code ? el('details', {}, el('summary', {}, '記法の例'), codeBlock(e.code)) : null));
  }

  const body = JSON.parse(document.getElementById('archive-body').textContent);
  const assets = JSON.parse(document.getElementById('archive-assets')?.textContent ?? '{}');
  const entries = new Map(body.entries.map(e => [e.id, e]));
  const stages = body.stages.map((s, i) => ({ ...s, n: i + 1 }));
  const pad = n => String(n).padStart(2, '0');
  const el = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) k === 'class' ? node.className = v : node.setAttribute(k, v);
    node.append(...children.filter(c => c !== undefined && c !== null));
    return node;
  };
  const digits = text => String(text).split(/(\d+)/).filter(Boolean).map(t => /^\d+$/.test(t) ? el('span', { class: 'digit' }, t) : t);
  const url = asset => `data:${asset.mimeType};base64,${asset.data}`;
  const adoptedTag = e => e.adopted ? el('span', { class: 'tag tag-adopted' }, '採用') : null;
  const basedOn = (e, label) => e.basedOn?.length
    ? el('p', { class: 'meta muted' }, `${label}: `, ...e.basedOn.flatMap((id, i) => [i ? ' / ' : '', el('a', { href: `#${id}` }, ...digits(entries.get(id).title))]))
    : null;
  const copyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>';
  const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  // navigator.clipboard only exists in secure contexts; a LAN http URL falls back to execCommand.
  const copyText = async text => {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    const area = el('textarea', { readonly: '', style: 'position:fixed;opacity:0' });
    area.value = text; document.body.append(area);
    area.select(); const ok = document.execCommand('copy'); area.remove();
    if (!ok) throw new Error('copy failed');
  };
  const codeBlock = text => {
    const button = el('button', { type: 'button', class: 'copy', 'aria-label': 'コピー', title: 'コピー' });
    button.innerHTML = copyIcon;
    const wrap = el('div', { class: 'code' }, el('pre', {}, text), button);
    button.addEventListener('click', async () => {
      let note = wrap.querySelector('.copy-done');
      if (!note) { note = el('span', { class: 'copy-done', role: 'status' }); wrap.append(note); }
      try { await copyText(text); button.innerHTML = checkIcon; note.textContent = 'コピーした'; }
      catch { note.textContent = 'コピーできなかった'; }
      clearTimeout(button.timer);
      button.timer = setTimeout(() => { button.innerHTML = copyIcon; note.remove(); }, 1500);
    });
    return wrap;
  };
  const section = (id, head, body) => el('details', { class: 'stage', id, open: '' },
    el('summary', { class: 'stage-head' }, el('span', { class: 'fold', 'aria-hidden': 'true' }), ...head), el('div', { class: 'stage-body' }, ...body));
  const finding = (label, text) => el('p', { class: 'finding' }, el('span', { class: 'finding-label muted' }, label), text);

  document.getElementById('title').textContent = body.title;
  document.getElementById('lead').append(...digits(body.summary));
  document.getElementById('created').append('作成日：', ...digits(body.created));
  if (body.notes?.length) document.getElementById('notes').append(el('span', { class: 'finding-label muted' }, '注記'), ...body.notes.map(n => el('p', {}, n)));
  else document.getElementById('notes').remove();
  for (const s of stages) {
    document.getElementById('toc').append(el('li', {}, el('a', { class: 'toc-link', href: `#${s.id}` },
      el('span', { class: 'num muted' }, pad(s.n)), el('span', {}, s.title), el('span', { class: 'muted' }, ...digits(`${s.entryIds.length}${UNIT}`)),
      el('span', { class: 'toc-desc muted' }, s.description))));
    const grid = el('div', { class: GRID_CLASS }, ...s.entryIds.map(id => renderCard(entries.get(id))));
    document.getElementById('stages').append(section(s.id,
      [el('span', { class: 'num muted' }, pad(s.n)), el('h2', {}, s.title), el('span', { class: 'muted' }, ...digits(`${s.entryIds.length}${UNIT}`))],
      [finding('経過', s.description), grid]));
  }

  const toggle = document.querySelector('[data-theme-toggle]');
  const labelToggle = () => {
    const label = document.documentElement.dataset.theme === 'obsidian' ? 'ライトテーマに切り替え' : 'ダークテーマに切り替え';
    toggle.setAttribute('aria-label', label); toggle.title = label;
  };
  labelToggle();
  toggle.addEventListener('click', () => {
    const root = document.documentElement, next = root.dataset.theme === 'snow' ? 'obsidian' : 'snow';
    root.dataset.theme = next; localStorage.setItem('theme', next); labelToggle();
  });

  // 図をタップまたはクリックで開き、拡大縮小と移動ができるようにする。画像はdata URIなので外部参照はない。
  const viewer = document.getElementById('viewer');
  const viewport = viewer.querySelector('.viewer-viewport');
  const viewerImage = viewer.querySelector('.viewer-image');
  const viewerTitle = document.getElementById('viewer-title');
  const scaleLabel = viewer.querySelector('[data-scale]');
  const pointers = new Map();
  let scale = 1, offsetX = 0, offsetY = 0, baseWidth = 1, baseHeight = 1, invoker;
  const drawViewer = () => {
    viewerImage.style.width = `${baseWidth}px`;
    viewerImage.style.height = `${baseHeight}px`;
    viewerImage.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    scaleLabel.textContent = `${Math.round(scale * 100)}%`;
  };
  const fitViewer = () => {
    if (!viewerImage.naturalWidth || !viewport.clientWidth) return;
    baseWidth = viewerImage.naturalWidth; baseHeight = viewerImage.naturalHeight;
    scale = Math.min((viewport.clientWidth - 24) / baseWidth, (viewport.clientHeight - 24) / baseHeight);
    offsetX = (viewport.clientWidth - baseWidth * scale) / 2;
    offsetY = (viewport.clientHeight - baseHeight * scale) / 2;
    drawViewer();
  };
  const zoomViewer = (factor, cx = viewport.clientWidth / 2, cy = viewport.clientHeight / 2) => {
    const next = Math.max(0.02, Math.min(32, scale * factor));
    const ratio = next / scale;
    offsetX = cx - (cx - offsetX) * ratio; offsetY = cy - (cy - offsetY) * ratio;
    scale = next; drawViewer();
  };
  const openViewer = button => {
    invoker = button;
    viewerTitle.textContent = button.dataset.title;
    viewerImage.alt = button.dataset.title;
    viewerImage.onload = fitViewer;
    viewerImage.src = url(assets[button.dataset.asset]);
    viewer.showModal();
    document.body.style.overflow = 'hidden';
    if (viewerImage.complete) fitViewer();
  };
  const pointIn = event => { const rect = viewport.getBoundingClientRect(); return { x: event.clientX - rect.left, y: event.clientY - rect.top }; };
  const pointerPair = () => { const [a, b] = [...pointers.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, distance: Math.hypot(a.x - b.x, a.y - b.y) }; };
  viewer.querySelector('[data-close]').addEventListener('click', () => viewer.close());
  viewer.querySelector('[data-fit]').addEventListener('click', fitViewer);
  viewer.querySelector('[data-zoom-in]').addEventListener('click', () => zoomViewer(1.4));
  viewer.querySelector('[data-zoom-out]').addEventListener('click', () => zoomViewer(1 / 1.4));
  viewer.addEventListener('close', () => { pointers.clear(); viewerImage.removeAttribute('src'); document.body.style.overflow = ''; invoker?.focus(); });
  viewport.addEventListener('wheel', event => {
    event.preventDefault();
    const p = pointIn(event);
    zoomViewer(Math.exp(-event.deltaY * 0.002), p.x, p.y);
  }, { passive: false });
  viewport.addEventListener('pointerdown', event => {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    viewport.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, pointIn(event));
  });
  viewport.addEventListener('pointermove', event => {
    if (!pointers.has(event.pointerId)) return;
    const previous = pointers.get(event.pointerId), next = pointIn(event);
    if (pointers.size === 1) {
      offsetX += next.x - previous.x; offsetY += next.y - previous.y;
      pointers.set(event.pointerId, next); drawViewer();
    } else {
      const before = pointerPair(); pointers.set(event.pointerId, next); const after = pointerPair();
      if (before.distance > 0) zoomViewer(after.distance / before.distance, before.x, before.y);
      offsetX += after.x - before.x; offsetY += after.y - before.y; drawViewer();
    }
  });
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    viewport.addEventListener(type, event => pointers.delete(event.pointerId));
  }
  viewport.addEventListener('keydown', event => {
    if (event.key === '+' || event.key === '=') zoomViewer(1.4);
    else if (event.key === '-') zoomViewer(1 / 1.4);
    else if (event.key === '0') fitViewer();
    else if (event.key === 'ArrowLeft') { offsetX += 60; drawViewer(); }
    else if (event.key === 'ArrowRight') { offsetX -= 60; drawViewer(); }
    else if (event.key === 'ArrowUp') { offsetY += 60; drawViewer(); }
    else if (event.key === 'ArrowDown') { offsetY -= 60; drawViewer(); }
    else return;
    event.preventDefault();
  });
  window.addEventListener('resize', () => { if (viewer.open) fitViewer(); });
  document.querySelectorAll('.thumb-button').forEach(button => button.addEventListener('click', () => openViewer(button)));

  // Opening a link into a collapsed section has to unfold it first, or the jump lands on nothing.
  const reveal = hash => {
    const target = hash.length > 1 && document.getElementById(decodeURIComponent(hash.slice(1)));
    if (!target) return;
    for (let d = target.closest('details'); d; d = d.parentElement.closest('details')) d.open = true;
    target.scrollIntoView();
  };
  document.addEventListener('click', ev => {
    const a = ev.target.closest('a[href^="#"]');
    if (a) requestAnimationFrame(() => reveal(a.getAttribute('href')));
  });
  document.documentElement.classList.remove('is-loading');
  reveal(location.hash);
})();
</script>
</body></html>
